<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Shooter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        #gameContainer {
            position: relative;
        }
        canvas {
            display: block;
            border: 2px solid #0ff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            color: #0ff;
            font-size: 18px;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.75);
            color: #0ff;
            text-align: center;
        }
        #overlay.hidden {
            display: none;
        }
        #overlay h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
        }
        #overlay h2 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #f44;
            text-shadow: 0 0 15px rgba(255, 68, 68, 0.8);
        }
        #overlay p {
            font-size: 20px;
            margin-bottom: 8px;
        }
        #overlay .start-msg {
            margin-top: 30px;
            font-size: 22px;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <span id="scoreDisplay">SCORE: 0</span>
            <span id="lifeDisplay"></span>
        </div>
        <div id="overlay">
            <h1>HORIZONTAL SHOOTER</h1>
            <p>Arrow Keys / WASD : Move</p>
            <p>Space / Z : Shoot</p>
            <p class="start-msg">Press SPACE to Start</p>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
